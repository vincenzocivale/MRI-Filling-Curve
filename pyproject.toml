[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MRI-Filling-Curve"
version = "0.1.0"
description = "LeJEPA pretraining of Gated DeltaNet-2 over 3D space-filling-curve traversals of MRI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "nibabel>=5.2",
  "torch>=2.5",
]

[project.scripts]
sfc = "sfc_gdn2.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# External foundation models (`sfc fm`); each adapter imports only what its model needs, lazily.
fm = ["monai>=1.4", "dynamic-network-architectures>=0.4.4,<0.5", "timm<1.0.23", "einops"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
