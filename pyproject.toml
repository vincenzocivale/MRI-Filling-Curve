[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MRI-Filling-Curve"
version = "0.1.0"
description = "LeJEPA pretraining of Gated DeltaNet-2 over 3D space-filling-curve traversals of MRI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
sfc = "sfc_gdn2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
