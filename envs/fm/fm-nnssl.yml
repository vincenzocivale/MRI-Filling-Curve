# OpenMind / nnFoundation (MIC-DKFZ/nnssl @ 94fe12d, branch nnFoundation) + the official downstream adaptation
# code in nnU-Net (MIC-DKFZ/nnUNet @ 2edf346, nnunetv2/training/nnUNetTrainer/pretraining), both installed editable
# from the original clones so their own pins apply (nnssl pyproject: python>=3.12, timm<=1.0.16,
# dynamic-network-architectures>=0.4.4,<0.5; nnUNet pyproject: torch>=2.1.2,!=2.9.*). DNA and timm are pinned to
# the exact versions the wrapper was verified with; torch 2.8.0+cu128 is the build the other envs run on the A100s.
name: fm-nnssl
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0+cu128
      - dynamic-network-architectures==0.4.4
      - timm==1.0.16
      - -e /leonardo_work/IscrC_SFMRI/fcorrent/repos/nnssl
      - -e /leonardo_work/IscrC_SFMRI/fcorrent/repos/nnUNet
      - nibabel
      - pyyaml
