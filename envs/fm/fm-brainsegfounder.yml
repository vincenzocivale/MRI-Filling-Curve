# BrainSegFounder (lab-smile/BrainSegFounder @ 0bbf432). Upstream pins: pretrain/requirements.txt
# (MONAI git a23c7f54, nibabel==3.1.1, einops==0.4.1), README (MONAI dev requirements + npnl/bidsio), ATLAS run
# in a MONAI 1.3.0 container. monai==1.2.0 is the newest release that still has the pre-#8285 (duplicate-slice)
# `PatchMerging` the weights were trained with (fixed in MONAI 1.5), `AddChanneld` (removed in 1.3, imported by
# pretrain/utils/data_utils.py) and `CropForegroundd(allow_smaller=True)` default; the swinViT is verified
# bitwise against the a23c7f54 source in tests/fm/brainsegfounder_parity.py. nibabel 3.2.2 = bidsio's pin.
name: fm-brainsegfounder
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.2+cu121
      - monai==1.2.0
      - numpy==1.22.4
      - nibabel==3.2.2
      - einops==0.4.1
      - pyyaml
      - git+https://github.com/npnl/bidsio@50e9262d5a80508d34e8ff0060f7a8013c0997fc
