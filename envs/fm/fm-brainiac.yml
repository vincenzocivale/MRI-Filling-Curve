# BrainIAC (AIM-KannLab/BrainIAC @ ba60f45): pins from its requirements.txt + README (python 3.9).
# torch is not pinned upstream; 2.3.1 is the CUDA-12.1 build contemporary with pytorch-lightning 2.3.3.
name: fm-brainiac
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1+cu121
      - pytorch-lightning==2.3.3
      - monai==1.3.2
      - nibabel==5.2.1
      - scikit-image==0.21.0
      - scikit-learn==1.2.2
      - scipy==1.10.1
      - seaborn==0.12.2
      - numpy==1.23.5
      - autograd==1.7.0
      - matplotlib==3.7.1
      - SimpleITK==2.4.0
      - tqdm
      - pydicom
      - wandb
      - lifelines
      - opencv-python
      - einops
      - pandas<2.3
      - pyyaml
