# BrainMVP (shaohao011/BrainMVP @ a466bb2): pins from the repo's requirements.txt + README (python 3.9).
# Only the packages the imported code needs (models/, utils/custom_trans.py, Downstream/dataset, Downstream/model);
# torch 2.6.0 as pinned, CUDA 12.4 wheel. itk (also pinned upstream) is not needed: MONAI's LoadImage tries
# NibabelReader first for .nii(.gz).
name: fm-brainmvp
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - monai==1.4.0
      - timm==1.0.15
      - nibabel==5.2.1
      - numpy==1.26.4
      - scipy==1.13.1
      - einops==0.8.1
      - PyYAML==6.0.1
