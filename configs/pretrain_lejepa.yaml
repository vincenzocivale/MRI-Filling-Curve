# LeJEPA over groups of patches: `sfc pretrain-pool` once (CPU job), then `sfc pretrain configs/pretrain_lejepa.yaml`.
# Per volume, groups (boxes of the patch grid); per group, two views (jittered box, intensity,
# own curve of `view_curves`; view A masked in aligned cubes). One masked-prediction task per scale (H-JEPA
# pattern, space for time): patch tokens, cubes of `levels` patches, the whole view (mean token), then every view of a
# volume, then every view of a session (the loader batches scans in pairs of one session). No held-out set:
# every checkpoint (save_every) is probed; the benchmark (bench.yaml group `sfc`) reads the last one.
seed: 17
output_root: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/sfc_pretrain_v8

data:
  pool:                       # `sfc pretrain-pool <this>` writes manifests[0] from the catalog (data/pool.py)
    catalog: /leonardo_work/IscrC_SFMRI/fcorrent/datasets/manifests/catalog.csv.gz
    datasets: [MR-RATE, FOMO300K, SALD, CoRR, Petfrog]   # DECISIONS.md Version 1 (MR-RATE: phase-1 brain series)
    exclude: /leonardo_work/IscrC_SFMRI/fcorrent/datasets/manifests/bench/volumes.csv   # downstream subjects: never
  manifests:                  # pretraining pool = union of each manifest's `pretrain` split
    - /leonardo_work/IscrC_SFMRI/fcorrent/datasets/manifests/pretrain/pool.csv.gz
  splits: [pretrain]
  patch_mm: 16.0              # patch = the scan's native voxels, round(16 / spacing) per axis (~16 mm); nothing resampled
  cache_dir: null             # no cache: workers decode the sources (zip members in memory); ~1M scans fit no cache
  num_workers: 8
  patches_per_batch: 98304    # per GPU: whole scans packed up to this many patches (~40 brains; a big body scan alone);
                              # 2-GPU dbg, 40 steps: 6x the v8 batch peaks at 10.7 GB (views over checkpoint_tokens are
                              # recomputed), ~31k patches/s per GPU vs ~9k at 16384
  mix_by: [dataset, modality] # strata of the mixing (pool: MR-RATE T1w 26% ... FOMO300K ADC 159 scans)
  mix_alpha: 1.0              # stratum share ~ n^alpha: 1 = as in the pool (MR-RATE 72%); 0.5-0.7 to try in the ablations

model:
  d_model: 256
  depth: 4
  head_dim: 64
  num_heads: 4
  use_short_conv: true
  grad_checkpoint: true         # GDN-2 blocks recomputed in backward when a step's views exceed objective.checkpoint_tokens
  embed:                      # continuous-kernel patch embedding (model.KernelEmbed), any spacing
    rank: 16                  # learned 1D basis functions per axis (kernel = G . phi_x phi_y phi_z)
    max_cycles_per_mm: 4.0    # highest Fourier frequency of phi (finest pool spacing 0.16 mm)

objective:
  view_curves: [raster, morton, hilbert]  # each view: one of these curves, in a random cube symmetry; probes average all three
  groups_global: 2            # per volume: boxes spanning global_frac of the foreground bounding box
  groups_local: 6             # per volume: boxes with edges log-uniform in local_edge patches
  global_frac: [0.3, 1.0]     # volume fraction of the foreground bounding box
  local_edge: [3, 8]          # patches per edge (27-512 tokens)
  jitter: 0.25                # view box = group box rescaled/shifted by up to this fraction of its edge
  max_view_tokens: null       # no cap: a global view can span a whole volume (whole body ~37k patches)
  thick_prob: 0.3             # per view: native slices averaged into slabs along a random axis ...
  thick_mm: [4, 8]            # ... ~4 or 8 mm thick (skipped where the scan's slices already are): thick-slice acquisitions
  mask_ratio: [0.2, 0.5]      # fraction of view A's cubes whose foreground patches get the mask token
  mask_cells: [1, 2, 4]       # per view A: cube edge (patches) of its mask, <= half the view's shortest edge
  levels: [2, 4]              # cube levels above the patch (32, 64 mm): mean token of fully masked A cubes -> B's (v8 smoke: 128 mm cubes got 0-4 pairs per step: masks that big fit only whole-body views)
  gamma: 0.3                  # intensity: x^exp(U(-g,g)) * U(1-scale,1+scale) + U(-shift,shift) + N(0, U(0,noise))
  scale: 0.1
  shift: 0.05
  noise: 0.02
  fg_threshold: 0.05          # foreground patch = mean above this (group centres are foreground)
  proj_hidden: 1024
  proj_dim: 64                # every head (view mean, patch, each cube level); LeJEPA Tab. 1d: small is better
  tokens_per_volume: 32       # B foreground tokens (and cells) per volume fed to their SIGReg: the estimate's sample
                              # count only (4 GPUs x 36 vols x 32 = 4608), not its weight (sigreg_samples); <32 also
                              # biases vol_share up (within-volume variance from too few tokens: floor 0.2 at 5)
  lam: 0.05                   # loss = (1-lam)*invariance + lam*SIGReg
  sigreg_slices: 256
  sigreg_knots: 17
  sigreg_samples: 768         # every SIGReg rescaled to this many samples (it grows with its sample count): same weight
                              # for every term whatever batch, tokens_per_volume, groups or GPUs; 768 = what lam was tuned on
  w_top: 1.0                  # weight of the view, volume and session terms (token and cells: 1), in both means

train:
  steps: 15000
  batch_size: 36               # per GPU, at most (data.patches_per_batch packs whole scans); 4 GPUs: 144 volumes per step,
                               # the samples of the volume level's SIGReg (~72 sessions for the session level)
  lr: 0.0005
  weight_decay: 0.05          # matrices only (see pretrain.param_groups)
  grad_clip: 1.0              # rare single-token gradient spikes (50-1500x median) otherwise; skip non-finite steps
  warmup_steps: 1000
  schedule: wsd               # warmup, constant, 1-sqrt decay over the last decay_steps (cosine: v8 and before)
  decay_steps: 3000           # a decay branch from a plateau checkpoint: resume_from it, steps = its step + this
  log_every: 250
  save_every: 2500            # encoder snapshot, all probed
  ckpt_every: 500             # full state (ckpt.pt, overwritten) + history.csv: a killed job loses at most this
  resume_from: null           # another run's ckpt.pt (used only when this run has none of its own)
