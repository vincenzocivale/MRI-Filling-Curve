# Frozen linear probe: `sfc probe configs/probe_sex.yaml --run-dir <run> [...] [--raw configs/pretrain_lejepa.yaml]`.
# Every checkpoint, fixed L2, fitted on train+val; test once, with a bootstrap 95% CI.
# Patching (patch_mm) and cache come from the run's own config.
# Sex is near-saturated by trivial cues (raw intensities ~0.81 AUC): a sanity check, not a ranking.
seed: 17
task: classification
manifest: data/manifests/fomo300k_sex.csv
label: sex
batch_size: 8
num_workers: 8
l2: {encoder: 1.0e-4, raw: 1.0}   # v7 CV selections, fixed since
