# MedicalNet / Med3D 3D-ResNet-10 (Tencent/MedicalNet), weights resnet_10.pth (shortcut B, README + keys).
# status: modality-agnostic (CT+MRI 3DSeg-8 pretraining); usable for T1w. Input = stored NIfTI array, nearest
#   resize to input_size, nonzero z-score with N(0,1) background noise (seeded). layer4 at stride 8.
model: medicalnet
env: ${SFC_FM_ENVS}/fm-medicalnet
repo: ${SFC_FM_REPOS}/MedicalNet
commit: 20f76aa
checkpoint: ${SFC_FM_MODELS}/MedicalNet/Resnet10/resnet_10.pth
args:
  depth: 10
  input_size: [56, 448, 448]   # setting.py input_D/H/W defaults
  seed: 1                      # background-noise RNG seed (repo leaves it unseeded)
