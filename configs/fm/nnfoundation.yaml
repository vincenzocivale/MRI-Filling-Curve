# nnFoundation (MIC-DKFZ/nnssl, branch nnFoundation): nnFoundationCNN (ResEnc-L, 102M) / nnFoundationViT (Primus, 674M),
# both MAE-pre-trained on 192^3 patches. Checkpoint = nnssl `checkpoint_final.pth` from
# https://huggingface.co/MIC-DKFZ/nnFoundationCNN or https://huggingface.co/MIC-DKFZ/nnFoundationViT
# Needs: pip install 'dynamic-network-architectures>=0.4.4,<0.5' 'timm<1.0.23' einops
model: nnfoundation
checkpoint: null
model_args:
  variant: cnn             # cnn (ResEncL) | vit (PrimusX: dim 1056, depth 40, 16 heads, 8^3 patches)
  input_size: null         # null: 192, or the checkpoint plan's patch size. Primus needs the pre-training size
  normalize: zscore_all    # or zscore_fg
  stage: -1                # CNN only: encoder stage used as feature map
  use_plan: true
