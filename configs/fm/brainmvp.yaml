# BrainMVP (shaohao011/BrainMVP): UniFormer-small 3D encoder, multi-modal MRI pretraining (CVPR 2025).
# Pure torch, no extra dependency.
model: brainmvp
# "BrainMVP_uniformer.pt" from the repo README (Google Drive, "Uniformer (recommend)"): dict with
# "state_dict" of the pretraining RecModel (module.encoder.uniformer.*, decoder.*, rep_template).
# null -> random-init encoder only (the `init` baseline).
checkpoint: null
model_args:
  in_channels: 1            # the released encoder is single-channel (one modality per forward pass)
  input_size: 96            # repo roi (patch_shape 96); must be divisible by 16
  pct: [5.0, 95.0]          # intensity percentiles (ScaleIntensityRangePercentiles, clip=True)
