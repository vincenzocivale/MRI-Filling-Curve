# AMAES (asbjrnmunk/amaes): MAE + augmentation reversal on BRAINS-45K, input scaled to [0, 1].
# Checkpoint: Zenodo https://zenodo.org/records/13604788 (unet_xl_lw_dec_fullaug.pth, unet_b_lw_dec_fullaug.pth,
# mednext_l3_lw_dec_fullaug.pth, mednext_m3_lw_dec_fullaug.pth); `arch` must match the file. Encoder only: no extra deps.
model: amaes
checkpoint: null
model_args:
  arch: unet_xl            # unet_xl | unet_b | mednext_l3 | mednext_m3 (_lw_dec suffix accepted)
  input_size: 128          # AMAES pre-training patch size
  normalize: unit          # our cube is already [0, 1]; or zscore_fg
  stage: -1                # 0..4; -1 = deepest (U-Net: stride 16, 16*filters channels)
