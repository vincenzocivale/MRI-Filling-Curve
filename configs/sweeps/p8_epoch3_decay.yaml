# Decay branch of p8_epoch3 to three epochs (user, 16/10): from its plateau checkpoint at step 29600, 1-sqrt decay over
# 1000 steps to step 30600 (~2.94M scans), queued after p8_epoch3 (afterany: if that job stopped early, this one resumes
# from its last checkpoint and runs the rest of the plateau first). Standard evaluation (mean-only skill, comparable with
# the earlier epochs; last-block segdec pilot); the official reading (notes/readout_run.sh: probe menu chosen on val,
# decoder on intermediate blocks) is queued after this job.
name: p8_epoch3_decay
root: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/tune
config: configs/pretrain_lejepa.yaml
fixed: {train.lr: 4.0e-4, train.steps: 30600, train.decay_steps: 1000, train.warmup_steps: 300, train.warmup_from: 3000,
        train.save_every: 1000, train.resume_from: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/tune/p8_epoch3/00/lejepa-b74c69af96/ckpt.pt,
        data.patches_per_batch: 131072, train.batch_size: 48, model.d_model: 1024, model.depth: 16, model.num_heads: 16,
        objective.max_packed_tokens: 262144, objective.checkpoint_tokens: 0, objective.mask_cells: [1, 2]}
runs:
  - {}
tasks: [age, sex, idh, grade, survival, mrs90, sequence]
dense: {task: tumor_ucsf, iters: 2500}
slurm: {gres: "gpu:2", cpus_per_task: 16, mem: 240G, time: "24:00:00"}
