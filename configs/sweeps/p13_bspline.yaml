# The new model (user, 19/10): the B-spline kernel (refinable: one kernel for every scale, read at 12 / 8 / 4 mm at
# evaluation) and every 4th block full attention, otherwise the recipe of epochs 1-4 (16 mm, mask_cells [1, 2], lr
# 4e-4, 2 GPUs x 48 scans = 96 per step, ~10.2k steps per epoch). From scratch, plateau to 9200 (no decay):
# p13_bspline_decay (9200 -> 10200 + the evaluation) and later epochs continue from its ckpt.pt.
name: p13_bspline
root: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/tune
config: configs/pretrain_lejepa.yaml
fixed: {train.lr: 4.0e-4, train.steps: 9200, train.decay_steps: 0, train.warmup_steps: 300, train.save_every: 1000,
        data.patches_per_batch: 131072, train.batch_size: 48, model.d_model: 1024, model.depth: 16, model.num_heads: 16,
        model.attn_every: 4, model.embed.basis: bspline, objective.max_packed_tokens: 262144, objective.checkpoint_tokens: 0,
        objective.mask_cells: [1, 2]}
runs:
  - {}
slurm: {gres: "gpu:2", cpus_per_task: 16, mem: 240G, time: "24:00:00"}
