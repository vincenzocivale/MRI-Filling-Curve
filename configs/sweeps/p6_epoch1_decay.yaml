# Decay branch of p6_epoch1 to one epoch (user, 14/10): from its plateau checkpoint at step 9200, 1-sqrt decay over
# 1000 steps to step 10200 (~979k scans, one epoch of the pool). Same recipe; queued after p6_epoch1 (afterany: if
# that job stopped early, this one resumes from its last checkpoint and runs the rest of the plateau first, since the
# schedule only decays over the last 1000 steps). Evaluation as p5_7h (skill on 7 tasks, tumor_ucsf val Dice).
name: p6_epoch1_decay
root: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/tune
config: configs/pretrain_lejepa.yaml
fixed: {train.lr: 4.0e-4, train.steps: 10200, train.decay_steps: 1000, train.warmup_steps: 300, train.warmup_from: 3000,
        train.save_every: 1000, train.resume_from: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/tune/p6_epoch1/00/lejepa-5094295066/ckpt.pt,
        data.patches_per_batch: 131072, train.batch_size: 48, model.d_model: 1024, model.depth: 16, model.num_heads: 16,
        objective.max_packed_tokens: 262144, objective.checkpoint_tokens: 0}
runs:
  - {}
tasks: [age, sex, idh, grade, survival, mrs90, sequence]
dense: {task: tumor_ucsf, iters: 2500}
slurm: {gres: "gpu:2", cpus_per_task: 16, mem: 240G, time: "24:00:00"}
