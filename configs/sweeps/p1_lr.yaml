# Phase 1 (notes/PIANO_TARATURA.md, D1): lr of the small model, 4 log-spaced values, 600 steps (~0.1 epoch);
# only optimisation changes, so the SSL loss at the end of the decay (history.csv) decides: no evaluation.
# 2 GPUs with the global batch unchanged (196,608 patches, 72 scans per GPU): half a node schedules sooner.
name: p1_lr
root: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/tune
config: configs/pretrain_lejepa.yaml
fixed: {train.steps: 600, train.decay_steps: 100, train.warmup_steps: 200, train.save_every: 600,
        data.patches_per_batch: 196608, train.batch_size: 72}
runs: [{train.lr: 3.0e-4}, {train.lr: 6.5e-4}, {train.lr: 1.4e-3}, {train.lr: 3.0e-3}]
tasks: []
slurm: {gres: "gpu:2", launch.nproc_per_node: 2, cpus_per_task: 16, mem: 240G, time: "01:45:00"}
