# Stage S2 (notes/IPERPARAMETRI.md): the objective's task/data choices, random search, scored by the tuning skill
# (bench-probe --tune: mean over tasks); the SSL loss does not compare across objectives. Set train.lr in `fixed` from
# s1_lr first. `python slurm/sweep.py configs/sweeps/s2_objective.yaml`
name: s2_objective
n: 16
seed: 0
root: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/tune
config: configs/pretrain_lejepa.yaml
fixed: {train.steps: 1200, train.decay_steps: 200, train.warmup_steps: 200, train.save_every: 1200}
space:
  objective.mask_ratio: {choice: [[0.1, 0.3], [0.2, 0.5], [0.4, 0.7]]}
  objective.mask_cells: {choice: [[1], [1, 2], [1, 2, 4], [1, 4]]}   # 1 always there: cubes must fit small views
  objective.global_frac: {choice: [[0.15, 1.0], [0.3, 1.0], [0.5, 1.0]]}
  objective.local_edge: {choice: [[2, 5], [3, 8], [4, 10]]}
  objective.lam: {log: [0.02, 0.1]}
  objective.w_top: {log: [0.25, 4.0]}
  data.mix_alpha: {choice: [1.0, 0.7, 0.5]}
  aug: {log: [1.0, 3.0], scales: {objective.gamma: 0.3, objective.scale: 0.1, objective.shift: 0.05, objective.noise: 0.02}}
tasks: [age, sex, idh, grade, survival, mrs90, sequence]
slurm: {time: "03:00:00"}
