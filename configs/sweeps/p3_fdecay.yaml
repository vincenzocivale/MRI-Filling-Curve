# Spectral prior of the kernel curves (notes/kernel_trained.py: after 760 steps the curves are still their rough
# init, content down to 0.25 mm; notes/kernel_init_check.py: at init a 1/f gain on the Fourier features cuts the
# curves' energy below 2 mm from 34 % to 2 % and the change of a patch's structure tokens between native and
# 2x2x2 blocks from 0.115 to 0.045; lowering max_cycles_per_mm instead changes nothing). G3 config, seed 17 as
# p3_g3 #0 (skill 0.489, Dice 0.351): paired. 1/f and 1/f^2.
name: p3_fdecay
root: /leonardo_scratch/large/userexternal/fcorrent/sfc_runs/tune
config: configs/pretrain_lejepa.yaml
fixed: {train.lr: 4.0e-4, train.steps: 760, train.decay_steps: 150, train.warmup_steps: 150, train.save_every: 760,
        data.patches_per_batch: 196608, train.batch_size: 72, model.d_model: 512, model.depth: 8, model.num_heads: 8,
        objective.max_packed_tokens: 262144}
runs:
  - {model.embed.freq_decay: 1.0}
  - {model.embed.freq_decay: 2.0}
tasks: [age, sex, idh, grade, survival, mrs90, sequence]
dense: {task: tumor_ucsf, iters: 2500}
slurm: {gres: "gpu:2", cpus_per_task: 16, mem: 240G, time: "03:00:00"}
