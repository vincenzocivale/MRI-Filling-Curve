seed: 17
output_root: outputs
curves: [raster, snake, morton, hilbert, random]
manifests:
  - data/manifests/openmind.csv

data:
  target_shape: [128, 128, 128]
  patch_size: 8
  cache_dir: .cache/volumes
  max_train_per_dataset: 13
  max_val_per_dataset: 3

model:
  d_model: 256
  depth: 4
  head_dim: 64
  num_heads: 4
  dropout: 0.0
  use_short_conv: true

microtrain:
  objective: masked
  steps: 500
  batch_size: 2
  lr: 0.0003
  weight_decay: 0.05
  mask_ratio: 0.50
  eval_every: 50
  amp: true

geometry:
  windows: [4, 8, 16, 32, 64, 128]
  spatial_radius: 1.75
